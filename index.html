<!doctype html>
<html>
<head>
    <title>Mouse Acceleration Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
html, body, canvas {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}
</style>
</head>
<body>
    <canvas id="view">

<script type="text/javascript">
    let unadjustedMovement = false 
    let pointerX = 0
    let pointerY = 0
    let canvas = document.getElementById("view")
    let ctx = canvas.getContext("2d")
    ctx.fillStyle = "black"
    const MAX_SAMPLES = 200
    let samplesX = new Float32Array(MAX_SAMPLES)
    let samplesY = new Float32Array(MAX_SAMPLES)
    let maxDx = 1
    let maxDy = 1
    let sampleIndex = 0
    function writeSample(dx, dy) {
        samplesX[sampleIndex] = dx
        samplesY[sampleIndex] = dy
        sampleIndex = (sampleIndex + 1) % MAX_SAMPLES
    }
    function drawSamples(minX, maxX, minY, maxY, maxValue, samples) {
        let dx = (maxX - minX) / samples.length
        let baseY = (maxY + minY) / 2
        let amplitude = (maxY - minY) / 2
        samples.forEach((value, index) => {
            let x = minX + index * dx
            ctx.fillRect(x, baseY, dx, value / maxValue * amplitude)
        })
    }

    canvas.addEventListener("click", (e) => {
        let requestedUnadjustedMovement = !unadjustedMovement
        let p = canvas.requestPointerLock({ unadjustedMovement: requestedUnadjustedMovement })
        if (!p) {
            console.log("Unadjusted movement is not supported")
        } else {
            p.then(() => { unadjustedMovement = requestedUnadjustedMovement })
                .catch((err) => { console.log(err) })
        }
    })

    canvas.addEventListener("mousemove", (e) => {
        let dx = e.movementX
        let dy = e.movementY
        maxDx = Math.max(maxDx, Math.abs(dx))
        maxDy = Math.max(maxDy, Math.abs(dy))
        writeSample(dx, dy)
        const sensitivity = 1
        pointerX = clamp(pointerX + sensitivity * dx, 0, canvas.width)
        pointerY = clamp(pointerY + sensitivity * dy, 0, canvas.height)
    })


    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value))
    }

    function onAnimationFrame() {
        let bounds = canvas.getBoundingClientRect()
        canvas.width = bounds.width
        canvas.height = bounds.height
        ctx.clearRect(0, 0, canvas.width, canvas.height)

        if (document.pointerLockElement) {
            ctx.fillRect(pointerX, pointerY, 10, 10)
            ctx.fillText(`Mouse acceleration ${unadjustedMovement ? "disabled" : "enabled"}`, 10, 10)
            drawSamples(0, canvas.width, 10, canvas.height / 2 - 10, maxDx, samplesX)
            drawSamples(0, canvas.width, canvas.height / 2 + 10, canvas.height - 10, maxDy, samplesY)
        }
        window.requestAnimationFrame(onAnimationFrame)
    }

    onAnimationFrame()
</script>

</body>
</html>
