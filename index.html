<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width"/>
<style>
.keyboard {
	position: relative;
	display: flex;
	flex-direction: row;
}
.white-key {
	display: flex;
	flex-direction: column;
	align-items: center;
	border: 2px solid black;
	width: 50px;
	height: 200px;
}
.black-key {
	display: flex;
	flex-direction: column;
	align-items: center;
	background-color: black;
	position: absolute;
	top: 0px;
	width: 30px;
	height: 120px;
}

.black-key1 {
	left: 38px;
}
.black-key2 {
	left: 92px;
}
.black-key3 {
	left: 198px;
}
.black-key4 {
	left: 252px;
}
.black-key5 {
	left: 304px;
}
	
</style>
</head>
<body>
	<script defer src="main.js" ></script>
	<button id="play-button">Play chord</button>
	<div class="keyboard">
		<div id="C" class="white-key"></div>
		<div id="D" class="white-key"></div>
		<div id="E" class="white-key"></div>
		<div id="F" class="white-key"></div>
		<div id="G" class="white-key"></div>
		<div id="A" class="white-key"></div>
		<div id="B" class="white-key"></div>

		<div id="C#" class="black-key black-key1"></div>
		<div id="D#" class="black-key black-key2"></div>
		<div id="F#" class="black-key black-key3"></div>
		<div id="G#" class="black-key black-key4"></div>
		<div id="A#" class="black-key black-key5"></div>
	</div>
</body>
</html>
